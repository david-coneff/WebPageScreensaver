name: .NET

on:
  push:
    # The working layers are named by glob, not by exact name: GitHub matches branch
    # filters exactly, so naming one stream branch left the streamless trunk
    # (rhiz-working) and any other stream unbuilt. master is the promoted clean branch.
    branches: [ master, "rhiz-working*" ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Setup .NET
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: 5.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal
