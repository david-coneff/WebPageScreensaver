name: .NET

on:
  push:
    branches: [ master, rhiz-working-bracken ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal
    # The two release builds (README "Binaries"): self-contained, and framework-dependent
    # packaged by the NSIS installer. Both cross-compile here (EnableWindowsTargeting).
    - name: Publish self-contained
      run: dotnet publish WebPageScreensaver.csproj -c Release -p:PublishProfile=PublishX64
    - name: Publish framework-dependent
      run: dotnet publish WebPageScreensaver.csproj -c Release -p:PublishProfile=PublishX64FrameworkDependent
    - name: Build the installer
      run: |
        sudo apt-get install -y nsis
        version=$(sed -n 's:.*<Version>\([0-9.]*\).*</Version>.*:\1:p' WebPageScreensaver.csproj)
        makensis -WX -DVERSION="$version" installer/WebPageScreensaver.nsi
    - uses: actions/upload-artifact@v4
      with:
        name: WebPageScreensaver-self-contained-x64
        path: Publish/Release/x64/WebPageScreensaver.scr
    - uses: actions/upload-artifact@v4
      with:
        name: WebPageScreensaver-installer-x64
        path: installer/*-setup.exe
